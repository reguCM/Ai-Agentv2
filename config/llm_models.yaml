deepseek_coder_v2_16b:
  model: deepseek-coder-v2:16b
  context_limit: 4096
  timeout_seconds: 90
  temperature: 0
  num_predict: 2048
  keep_alive: 5m
  prompt_style: english_compact
  materials:
    compact_json: true
    drop_keys: []
    current_source_max_chars: 2500
  strengths:
    - 短い英語指示と圧縮 JSON なら構造修正ができる
    - 確認済みコマンドへの置き換えができる
    - dict 化は安定しやすい
  weaknesses:
    - 材料が長いと prompt overflow（context 超過）になる
    - 表の見出し・区切り線を値として残しやすい
    - status に空文字や見出し語（load など）を入れやすい
    - 日本語の長い指示は弱い
